<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notion Tap Widgets</title>

  <style>
    :root{
      --notion-bg: #191919;

      --text: #EAF0FF;
      --muted: rgba(234,240,255,.62);

      --glassTop: rgba(20,20,24,.92);
      --glassBot: rgba(14,14,18,.86);
      --stroke: rgba(255,255,255,.10);
      --shadow: 0 14px 40px rgba(0,0,0,.55);

      --track: rgba(255,255,255,.06);
      --trackStroke: rgba(255,255,255,.08);

      --r: 22px;
      --h: 96px;            /* FIXED HEIGHT */
      --padX: 14px;
      --padY: 12px;

      /* default accent */
      --a1:#7C3AED;
      --a2:#22D3EE;
      --a3:#34D399;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; height:100%; background: var(--notion-bg); }
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      overflow: hidden; /* embed-friendly */
    }

    /* IMPORTANT: no padding around, so Notion bg doesn't "frame" the embed */
    .widget-container{
      width:100%;
      height:100%;
      background: var(--notion-bg);

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 14px;

      padding: 0;                 /* <= no outer padding */
      overflow-x: auto;           /* <= narrow containers scroll horizontally */
      overflow-y: hidden;
    }

    /* Card */
    .tap{
      width: min(980px, 100%);
      min-width: 520px;           /* <= prevents vertical reflow; forces horizontal scroll instead */
      height: var(--h);           /* <= fixed height */
      padding: var(--padY) var(--padX);

      border-radius: var(--r);
      background: linear-gradient(180deg, var(--glassTop), var(--glassBot));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);

      position:relative;
      overflow:hidden;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transform: translateZ(0);
    }

    /* subtle liquid bloom (kept calm for readability) */
    .tap::before{
      content:"";
      position:absolute;
      inset:-90px;
      background:
        radial-gradient(520px 280px at 15% 40%, color-mix(in srgb, var(--a1) 26%, transparent), transparent 62%),
        radial-gradient(520px 280px at 85% 25%, color-mix(in srgb, var(--a2) 18%, transparent), transparent 60%),
        radial-gradient(520px 280px at 70% 95%, color-mix(in srgb, var(--a3) 16%, transparent), transparent 62%);
      filter: blur(18px);
      opacity: .95;
      pointer-events:none;
    }

    .row{
      position:relative;
      z-index:1;

      height: 100%;
      display:grid;
      grid-template-columns: 56px 1fr auto;
      gap: 14px;
      align-items:center;
    }

    .icon{
      width:56px;height:56px;
      border-radius: 16px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
    }
    .icon svg{ width:26px;height:26px; opacity:.95; }

    .content{
      min-width:0;
      display:grid;
      gap: 10px;
    }

    .topline{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 12px;
    }

    .title{
      font-weight: 780;
      letter-spacing: .2px;
      font-size: 15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .value{
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      font-size: 15px;
      opacity:.98;
      white-space:nowrap;
      flex:0 0 auto;
    }

    .bar{
      height: 10px;
      border-radius: 999px;
      background: var(--track);
      border: 1px solid var(--trackStroke);
      overflow:hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.22);
    }

    .fill{
      height:100%;
      width:0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3));
      filter: saturate(1.15);
      transition: width 260ms cubic-bezier(.2,.9,.2,1);
    }

    .controls{
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .btn{
      width:42px;height:42px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      transition: transform 90ms ease;
    }
    .btn:active{ transform: translateY(1px) scale(.98); }
    .btn svg{ width:18px;height:18px; opacity:.95; }

    /* Tap feedback */
    .tap.pulse{ animation: pulseCard 240ms cubic-bezier(.2,.9,.2,1); }
    @keyframes pulseCard{
      0%{ transform: scale(1); }
      40%{ transform: scale(.992); }
      100%{ transform: scale(1); }
    }
    .bar.squish{ animation: squish 240ms cubic-bezier(.2,.9,.2,1); }
    @keyframes squish{
      0%{ transform: scaleX(1); }
      45%{ transform: scaleX(.985); }
      100%{ transform: scaleX(1); }
    }

    /* Small screens: keep SAME HEIGHT, just reduce typography a bit */
    @media (max-width: 600px){
      :root{ --h: 96px; } /* same */
      .tap{ min-width: 520px; } /* keep */
      .title{ font-size: 14px; }
      .value{ font-size: 14px; }
      .btn{ width:40px; height:40px; border-radius: 13px; }
      .icon{ width:54px; height:54px; }
    }
  </style>
</head>

<body>
  <div class="widget-container">

    <!-- 1) Read Book Pages (goal 10, step 1) -->
    <div class="tap js-tap"
         data-key="read_pages"
         data-title="Read Book Pages"
         data-goal="10"
         data-step="1"
         data-unit="pages"
         style="--a1:#7C3AED;--a2:#22D3EE;--a3:#34D399;">
      <div class="row">
        <div class="icon" aria-hidden="true">
          <!-- book -->
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4.5 19.5c1.6-1 3.4-1.5 5.5-1.5h10V6H10c-2.1 0-3.9.5-5.5 1.5v12Z"
                  stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M4.5 7.5C6.1 6.5 7.9 6 10 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="content">
          <div class="topline">
            <div class="title">Read Book Pages</div>
            <div class="value"><span class="js-cur">0</span>/<span class="js-goal">10</span></div>
          </div>
          <div class="bar js-bar"><div class="fill js-fill"></div></div>
        </div>

        <div class="controls">
          <button class="btn js-minus" type="button" aria-label="Decrease">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 12h12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
          </button>
          <button class="btn js-plus" type="button" aria-label="Increase">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 2) Drink Water (goal 2000ml, step 200ml) -->
    <div class="tap js-tap"
         data-key="drink_water"
         data-title="Drink Water"
         data-goal="2000"
         data-step="200"
         data-unit="ml"
         style="--a1:#06B6D4;--a2:#22C55E;--a3:#A3E635;">
      <div class="row">
        <div class="icon" aria-hidden="true">
          <!-- droplet -->
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3s6 6.6 6 11.2A6 6 0 0 1 6 14.2C6 9.6 12 3 12 3Z"
                  stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="content">
          <div class="topline">
            <div class="title">Drink Water</div>
            <div class="value"><span class="js-cur">0</span>/<span class="js-goal">2000</span> ml</div>
          </div>
          <div class="bar js-bar"><div class="fill js-fill"></div></div>
        </div>

        <div class="controls">
          <button class="btn js-minus" type="button" aria-label="Decrease">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 12h12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
          </button>
          <button class="btn js-plus" type="button" aria-label="Increase">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 3) Mobility Warm-up (goal 15min, step 1min) -->
    <div class="tap js-tap"
         data-key="warmup"
         data-title="Mobility Warm-up"
         data-goal="15"
         data-step="1"
         data-unit="min"
         style="--a1:#F97316;--a2:#EC4899;--a3:#8B5CF6;">
      <div class="row">
        <div class="icon" aria-hidden="true">
          <!-- timer -->
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M9 3h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 8v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 13a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"
                  stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>

        <div class="content">
          <div class="topline">
            <div class="title">Mobility Warm-up</div>
            <div class="value"><span class="js-cur">0</span>/<span class="js-goal">15</span> min</div>
          </div>
          <div class="bar js-bar"><div class="fill js-fill"></div></div>
        </div>

        <div class="controls">
          <button class="btn js-minus" type="button" aria-label="Decrease">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 12h12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
          </button>
          <button class="btn js-plus" type="button" aria-label="Increase">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Minimal multi-widget controller + persistence (silent, no UI)
    const taps = document.querySelectorAll(".js-tap");

    function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

    taps.forEach(card => {
      const key   = card.dataset.key || Math.random().toString(16).slice(2);
      const goal  = Number(card.dataset.goal || 10);
      const step  = Number(card.dataset.step || 1);

      const curEl  = card.querySelector(".js-cur");
      const goalEl = card.querySelector(".js-goal");
      const fill   = card.querySelector(".js-fill");
      const bar    = card.querySelector(".js-bar");
      const plus   = card.querySelector(".js-plus");
      const minus  = card.querySelector(".js-minus");

      // load saved
      let current = Number(localStorage.getItem("tap_" + key) || 0);

      // set goal text once (keeps your HTML consistent if you change attrs)
      if (goalEl) goalEl.textContent = String(goal);

      function render(){
        current = clamp(current, 0, goal);
        curEl.textContent = String(current);

        const pct = goal > 0 ? Math.round((current / goal) * 100) : 0;
        fill.style.width = pct + "%";
      }

      function animate(){
        card.classList.remove("pulse");
        bar.classList.remove("squish");
        void card.offsetWidth;
        card.classList.add("pulse");
        bar.classList.add("squish");
      }

      function bump(delta){
        current = clamp(current + delta, 0, goal);
        localStorage.setItem("tap_" + key, String(current));
        render();
        animate();
      }

      plus.addEventListener("click", () => bump(step));
      minus.addEventListener("click", () => bump(-step));

      render();
    });
  </script>
</body>
</html>
