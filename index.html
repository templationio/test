<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notion Tap Widget</title>

  <style>
    :root{
      /* Transparent page for Notion embeds */
      --page-bg: #191919;

      /* Text */
      --text: #EAF0FF;
      --muted: rgba(234,240,255,.68);

      /* Dark glass (KEY CHANGE) */
      --glassTop: rgba(255,255,255,.04);
      --glassBot: rgba(255,255,255,.02);

      /* Inner contrast overlay */
      --overlayTop: rgba(0,0,0,.18);
      --overlayBot: rgba(0,0,0,.34);

      /* Strokes / shadows */
      --stroke: rgba(255,255,255,.12);
      --stroke2: rgba(255,255,255,.08);
      --shadow: 0 18px 55px rgba(0,0,0,.62);
      --shadow2: 0 10px 28px rgba(0,0,0,.42);

      /* Radius / spacing */
      --r: 22px;
      --pad: 14px;

      /* Accent gradient (Revolut-ish) */
      --g1: #7C3AED;
      --g2: #22D3EE;
      --g3: #34D399;

      /* Bar */
      --track: rgba(255,255,255,.08);
      --trackStroke: rgba(255,255,255,.10);
    }

    /* Optional light theme */
    [data-theme="light"]{
      --text: #0B1220;
      --muted: rgba(11,18,32,.62);

      --glassTop: rgba(255,255,255,.78);
      --glassBot: rgba(255,255,255,.58);

      --overlayTop: rgba(255,255,255,.12);
      --overlayBot: rgba(255,255,255,.10);

      --stroke: rgba(11,18,32,.10);
      --stroke2: rgba(11,18,32,.08);

      --shadow: 0 16px 45px rgba(0,0,0,.16);
      --shadow2: 0 10px 26px rgba(0,0,0,.12);

      --track: rgba(11,18,32,.08);
      --trackStroke: rgba(11,18,32,.10);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body{ width:100%; height:100%; }
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--page-bg);
      color: var(--text);
      overflow: hidden; /* embed-friendly */
    }

    .widget-container{
      width:100%;
      height:100%;
      display:grid;
      place-items:center;
      padding: 18px;
    }

    .tap{
      width: min(980px, 100%);
      border-radius: var(--r);
      background: linear-gradient(180deg, var(--glassTop), var(--glassBot));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position:relative;
      padding: var(--pad);
      transform: translateZ(0);
    }

    /* Contrast overlay (KEY CHANGE) */
    .tap .overlay{
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, var(--overlayTop), var(--overlayBot));
      pointer-events:none;
      z-index:0;
    }

    /* Liquid blooms but subdued (so text stays readable) */
    .tap::before{
      content:"";
      position:absolute;
      inset:-90px;
      background:
        radial-gradient(520px 300px at 18% 38%, rgba(124,58,237,.22), transparent 62%),
        radial-gradient(560px 300px at 82% 20%, rgba(34,211,238,.16), transparent 60%),
        radial-gradient(520px 280px at 70% 92%, rgba(52,211,153,.14), transparent 62%);
      filter: blur(20px);
      opacity:.95;
      pointer-events:none;
      z-index:0;
    }

    /* Subtle sheen */
    .tap::after{
      content:"";
      position:absolute;
      left:-35%;
      top:-65%;
      width:75%;
      height:240%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent);
      transform: rotate(18deg);
      opacity:.20;
      pointer-events:none;
      z-index:0;
    }

    .row{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns: 56px 1fr auto;
      gap: 14px;
      align-items:center;
    }

    .icon{
      width:56px;height:56px;
      border-radius: 16px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.06);
      border:1px solid var(--stroke2);
      box-shadow: var(--shadow2);
    }
    .icon svg{ width:26px;height:26px; opacity:.95; }

    .content{
      min-width:0;
      display:grid;
      gap: 8px;
    }

    .topline{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 12px;
    }

    .title{
      font-weight: 780;
      letter-spacing: .2px;
      font-size: 15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .count{
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      letter-spacing:.2px;
      font-size: 16px;
      opacity:.98;
      flex: 0 0 auto;
    }

    .bar{
      height: 10px;
      border-radius: 999px;
      background: var(--track);
      border: 1px solid var(--trackStroke);
      overflow:hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
      transform: translateZ(0);
    }
    .fill{
      height:100%;
      width:0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
      filter: saturate(1.15);
      transition: width 260ms cubic-bezier(.2,.9,.2,1);
      position:relative;
    }
    .fill::after{
      content:"";
      position:absolute;
      inset:-10px -40px;
      background: radial-gradient(120px 22px at 55% 50%, rgba(255,255,255,.20), transparent 60%);
      opacity:.55;
      pointer-events:none;
      transform: translateX(-25px);
      animation: shimmer 2.8s linear infinite;
    }
    @keyframes shimmer{
      0%{ transform: translateX(-90px); opacity:.25; }
      50%{ opacity:.55; }
      100%{ transform: translateX(220px); opacity:.25; }
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap: 10px;
      color: var(--muted);
      font-size: 12.5px;
      line-height:1.2;
    }
    .dot{
      width:4px;height:4px;border-radius:999px;
      background: rgba(234,240,255,.28);
    }

    .badges{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-top: 2px;
    }
    .badge{
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.26);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 12.5px;
      color: rgba(234,240,255,.86);
      font-variant-numeric: tabular-nums;
      white-space:nowrap;
    }
    [data-theme="light"] .badge{
      background: rgba(255,255,255,.55);
      color: rgba(11,18,32,.78);
    }

    .controls{
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .btn{
      width:42px;height:42px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      box-shadow: var(--shadow2);
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      transition: transform 90ms ease, border-color 160ms ease, background 160ms ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .btn:hover{
      border-color: rgba(255,255,255,.22);
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
    }
    .btn:active{ transform: translateY(1px) scale(.98); }
    .btn svg{ width:18px;height:18px; opacity:.95; }

    /* Click animations */
    .tap.pulse{ animation: pulseCard 240ms cubic-bezier(.2,.9,.2,1); }
    @keyframes pulseCard{
      0%{ transform: scale(1); }
      40%{ transform: scale(.992); }
      100%{ transform: scale(1); }
    }
    .bar.squish{ animation: squish 240ms cubic-bezier(.2,.9,.2,1); }
    @keyframes squish{
      0%{ transform: scaleX(1); }
      45%{ transform: scaleX(.985); }
      100%{ transform: scaleX(1); }
    }

    /* Responsive */
    @media (max-width: 720px){
      body{ overflow-y:auto; }
      .widget-container{ padding: 14px; }

      .row{
        grid-template-columns: 54px 1fr;
        grid-template-rows: auto auto;
        gap: 12px;
        align-items:start;
      }
      .controls{
        grid-column: 1 / -1;
        justify-content:flex-end;
        margin-top: 6px;
      }
      .btn{ width:44px; height:44px; }
      .title{ font-size: 14px; }
      .count{ font-size: 15px; }
    }

    @media (max-width: 420px){
      .tap{ padding: 12px; border-radius: 18px; }
      .icon{ width:50px; height:50px; border-radius: 14px; }
      .btn{ width:42px; height:42px; border-radius: 13px; }
      .badge{ padding: 6px 9px; font-size: 12px; }
      .meta{ font-size: 12px; }
    }
  </style>
</head>

<body>
  <div class="widget-container">
    <div class="tap" id="tapWidget" data-current="0" data-goal="8">
      <div class="overlay" aria-hidden="true"></div>

      <div class="row">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 18.5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M8.5 18.5l-1.2-8.2A3 3 0 0 1 10.27 7h3.46a3 3 0 0 1 2.97 3.3l-1.2 8.2"
                  stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M9.7 7.2c.2-1.5 1.2-2.7 2.3-2.7s2.1 1.2 2.3 2.7"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="content">
          <div class="topline">
            <div class="title" id="wTitle">No-Spend: Coffee</div>
            <div class="count"><span id="wCurrent">0</span>/<span id="wGoal">8</span></div>
          </div>

          <div class="bar" id="wBar" aria-label="progress">
            <div class="fill" id="wFill"></div>
          </div>

          <div class="meta">
            <span id="wStatus">8 taps to goal</span>
            <span class="dot"></span>
            <span id="wUpdated">updated 15:03</span>
          </div>

          <div class="badges">
            <span class="badge">+1 = one event</span>
            <span class="badge" id="wPct">0%</span>
          </div>
        </div>

        <div class="controls">
          <div class="btn" id="minusBtn" title="Decrease">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 12h12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="btn" id="plusBtn" title="Increase">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const el = document.getElementById("tapWidget");

    const currentEl = document.getElementById("wCurrent");
    const goalEl    = document.getElementById("wGoal");
    const fillEl    = document.getElementById("wFill");
    const pctEl     = document.getElementById("wPct");
    const statusEl  = document.getElementById("wStatus");
    const updatedEl = document.getElementById("wUpdated");
    const barEl     = document.getElementById("wBar");

    const plusBtn   = document.getElementById("plusBtn");
    const minusBtn  = document.getElementById("minusBtn");

    let current = clampInt(parseInt(el.dataset.current ?? "0", 10), 0, 9999);
    let goal    = clampInt(parseInt(el.dataset.goal ?? "8", 10), 1, 9999);

    function clampInt(n, a, b){
      n = Number.isFinite(n) ? Math.trunc(n) : a;
      return Math.max(a, Math.min(b, n));
    }

    function formatTime(){
      const d = new Date();
      return d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
    }

    function render(){
      current = clampInt(current, 0, goal);

      currentEl.textContent = String(current);
      goalEl.textContent = String(goal);

      const pct = Math.round((current / goal) * 100);
      fillEl.style.width = pct + "%";
      pctEl.textContent = pct + "%";

      const left = Math.max(0, goal - current);
      statusEl.textContent = left === 0 ? "goal completed" : `${left} taps to goal`;
      updatedEl.textContent = "updated " + formatTime();
    }

    function animateTap(){
      el.classList.remove("pulse");
      barEl.classList.remove("squish");
      void el.offsetWidth;
      el.classList.add("pulse");
      barEl.classList.add("squish");
    }

    function bump(delta){
      current = clampInt(current + delta, 0, goal);
      render();
      animateTap();
    }

    plusBtn.addEventListener("click", () => bump(+1));
    minusBtn.addEventListener("click", () => bump(-1));

    render();
  </script>
</body>
</html>
