<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notion Tap Widget</title>

  <style>
    :root{
      /* Notion-friendly (transparent by default) */
      --page-bg: transparent;

      /* Core */
      --text: #EAF0FF;
      --muted: rgba(234,240,255,.65);

      /* Liquid glass */
      --glassTop: rgba(255,255,255,.10);
      --glassBot: rgba(255,255,255,.04);
      --stroke: rgba(255,255,255,.14);
      --stroke2: rgba(255,255,255,.08);
      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --shadow2: 0 10px 30px rgba(0,0,0,.35);

      /* Radius / spacing */
      --r: 22px;
      --pad: 14px;

      /* Accent gradient (Revolut-ish) */
      --g1: #7C3AED; /* violet */
      --g2: #22D3EE; /* cyan */
      --g3: #34D399; /* green */
    }

    /* Optional: light theme if you ever want it */
    [data-theme="light"]{
      --page-bg: transparent;
      --text: #0B1220;
      --muted: rgba(11,18,32,.62);

      --glassTop: rgba(255,255,255,.75);
      --glassBot: rgba(255,255,255,.55);
      --stroke: rgba(11,18,32,.10);
      --stroke2: rgba(11,18,32,.08);

      --shadow: 0 16px 45px rgba(0,0,0,.15);
      --shadow2: 0 10px 28px rgba(0,0,0,.10);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body{ width:100%; height:100%; }
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--page-bg);
      color: var(--text);
      overflow: hidden; /* embed-friendly */
    }

    /* Embed-friendly container: fills iframe */
    .widget-container{
      width:100%;
      height:100%;
      display:grid;
      place-items:center;
      padding: 18px;
    }

    /* Tap widget card */
    .tap{
      width: min(980px, 100%);
      border-radius: var(--r);
      background: linear-gradient(180deg, var(--glassTop), var(--glassBot));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position:relative;
      padding: var(--pad);
      transform: translateZ(0);
    }

    /* Inner “bloom” gradients (liquid feel) */
    .tap::before{
      content:"";
      position:absolute;
      inset:-80px;
      background:
        radial-gradient(450px 260px at 20% 40%, rgba(124,58,237,.32), transparent 60%),
        radial-gradient(480px 260px at 80% 20%, rgba(34,211,238,.24), transparent 58%),
        radial-gradient(420px 240px at 70% 90%, rgba(52,211,153,.18), transparent 60%);
      filter: blur(18px);
      opacity:.85;
      pointer-events:none;
    }

    /* Subtle sheen */
    .tap::after{
      content:"";
      position:absolute;
      left:-30%;
      top:-60%;
      width:70%;
      height:220%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
      transform: rotate(18deg);
      opacity:.35;
      pointer-events:none;
    }

    /* Layout */
    .row{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns: 56px 1fr auto;
      gap: 14px;
      align-items:center;
    }

    .icon{
      width:56px;height:56px;
      border-radius: 16px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.08);
      border:1px solid var(--stroke2);
      box-shadow: var(--shadow2);
    }
    .icon svg{ width:26px;height:26px; opacity:.95; }

    .content{
      min-width:0;
      display:grid;
      gap: 8px;
    }

    .topline{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 12px;
    }

    .title{
      font-weight: 780;
      letter-spacing: .2px;
      font-size: 15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .count{
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      letter-spacing:.2px;
      font-size: 16px;
      opacity:.95;
      flex: 0 0 auto;
    }

    /* Progress bar */
    .bar{
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.10);
      overflow:hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
      transform: translateZ(0);
    }
    .fill{
      height:100%;
      width:0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
      filter: saturate(1.12);
      transition: width 260ms cubic-bezier(.2,.9,.2,1);
      position:relative;
    }
    .fill::after{
      content:"";
      position:absolute;
      inset:-10px -40px;
      background: radial-gradient(120px 22px at 55% 50%, rgba(255,255,255,.22), transparent 60%);
      opacity:.6;
      pointer-events:none;
      transform: translateX(-25px);
      animation: shimmer 2.8s linear infinite;
    }
    @keyframes shimmer{
      0%{ transform: translateX(-90px); opacity:.32; }
      50%{ opacity:.65; }
      100%{ transform: translateX(220px); opacity:.32; }
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap: 10px;
      color: var(--muted);
      font-size: 12.5px;
      line-height:1.2;
    }
    .dot{
      width:4px;height:4px;border-radius:999px;
      background: rgba(234,240,255,.35);
    }

    .badges{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-top: 2px;
    }
    .badge{
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 12.5px;
      color: rgba(234,240,255,.82);
      font-variant-numeric: tabular-nums;
      white-space:nowrap;
    }
    [data-theme="light"] .badge{
      background: rgba(255,255,255,.55);
      color: rgba(11,18,32,.78);
    }

    /* Controls */
    .controls{
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .btn{
      width:42px;height:42px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      box-shadow: var(--shadow2);
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      transition: transform 90ms ease, border-color 160ms ease, background 160ms ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .btn:hover{
      border-color: rgba(255,255,255,.22);
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
    }
    .btn:active{ transform: translateY(1px) scale(.98); }
    .btn svg{ width:18px;height:18px; opacity:.95; }

    /* Click animations */
    .tap.pulse{ animation: pulseCard 240ms cubic-bezier(.2,.9,.2,1); }
    @keyframes pulseCard{
      0%{ transform: scale(1); }
      40%{ transform: scale(.992); }
      100%{ transform: scale(1); }
    }
    .bar.squish{ animation: squish 240ms cubic-bezier(.2,.9,.2,1); }
    @keyframes squish{
      0%{ transform: scaleX(1); }
      45%{ transform: scaleX(.985); }
      100%{ transform: scaleX(1); }
    }

    /* Responsive: make it “pleasant” on narrow embeds */
    @media (max-width: 720px){
      body{ overflow-y:auto; } /* if the embed gets short */
      .widget-container{ padding: 14px; }

      .row{
        grid-template-columns: 54px 1fr;
        grid-template-rows: auto auto;
        gap: 12px;
        align-items:start;
      }

      .controls{
        grid-column: 1 / -1;
        justify-content:flex-end;
        margin-top: 6px;
      }

      .btn{ width:44px; height:44px; }
      .title{ font-size: 14px; }
      .count{ font-size: 15px; }
    }

    @media (max-width: 420px){
      .tap{ padding: 12px; border-radius: 18px; }
      .icon{ width:50px; height:50px; border-radius: 14px; }
      .btn{ width:42px; height:42px; border-radius: 13px; }
      .badge{ padding: 6px 9px; font-size: 12px; }
      .meta{ font-size: 12px; }
    }
  </style>
</head>

<body>
  <div class="widget-container">
    <!-- Copy/paste this card to create multiple widgets -->
    <div class="tap" id="tapWidget" data-current="0" data-goal="8">
      <div class="row">
        <div class="icon" aria-hidden="true">
          <!-- Minimal icon -->
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 18.5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M8.5 18.5l-1.2-8.2A3 3 0 0 1 10.27 7h3.46a3 3 0 0 1 2.97 3.3l-1.2 8.2"
                  stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M9.7 7.2c.2-1.5 1.2-2.7 2.3-2.7s2.1 1.2 2.3 2.7"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="content">
          <div class="topline">
            <div class="title" id="wTitle">No-Spend: Coffee</div>
            <div class="count"><span id="wCurrent">0</span>/<span id="wGoal">8</span></div>
          </div>

          <div class="bar" id="wBar" aria-label="progress">
            <div class="fill" id="wFill"></div>
          </div>

          <div class="meta">
            <span id="wStatus">8 taps to goal</span>
            <span class="dot"></span>
            <span id="wUpdated">updated 15:03</span>
          </div>

          <div class="badges">
            <span class="badge">+1 = one event</span>
            <span class="badge" id="wPct">0%</span>
          </div>
        </div>

        <div class="controls">
          <div class="btn" id="minusBtn" title="Decrease">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 12h12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
            </svg>
          </div>

          <div class="btn" id="plusBtn" title="Increase">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Minimal logic (no deps)
    const el = document.getElementById("tapWidget");

    const currentEl = document.getElementById("wCurrent");
    const goalEl    = document.getElementById("wGoal");
    const fillEl    = document.getElementById("wFill");
    const pctEl     = document.getElementById("wPct");
    const statusEl  = document.getElementById("wStatus");
    const updatedEl = document.getElementById("wUpdated");
    const barEl     = document.getElementById("wBar");

    const plusBtn   = document.getElementById("plusBtn");
    const minusBtn  = document.getElementById("minusBtn");

    let current = clampInt(parseInt(el.dataset.current ?? "0", 10), 0, 9999);
    let goal    = clampInt(parseInt(el.dataset.goal ?? "8", 10), 1, 9999);

    function clampInt(n, a, b){
      n = Number.isFinite(n) ? Math.trunc(n) : a;
      return Math.max(a, Math.min(b, n));
    }

    function formatTime(){
      const d = new Date();
      return d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
    }

    function render(){
      current = clampInt(current, 0, goal);

      currentEl.textContent = String(current);
      goalEl.textContent = String(goal);

      const pct = Math.round((current / goal) * 100);
      fillEl.style.width = pct + "%";
      pctEl.textContent = pct + "%";

      const left = Math.max(0, goal - current);
      statusEl.textContent = left === 0 ? "goal completed" : `${left} taps to goal`;
      updatedEl.textContent = "updated " + formatTime();
    }

    function animateTap(){
      el.classList.remove("pulse");
      barEl.classList.remove("squish");
      void el.offsetWidth; // restart animation
      el.classList.add("pulse");
      barEl.classList.add("squish");
    }

    function bump(delta){
      current = clampInt(current + delta, 0, goal);
      render();
      animateTap();
    }

    plusBtn.addEventListener("click", () => bump(+1));
    minusBtn.addEventListener("click", () => bump(-1));

    // Double-click anywhere on the card (except buttons) to +1
    el.addEventListener("dblclick", (e) => {
      if (e.target.closest(".btn")) return;
      bump(+1);
    });

    render();
  </script>
</body>
</html>
